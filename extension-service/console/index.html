<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>harness console</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="bar">
      <span id="dot" class="off" title="service status"></span>
      <span class="title">gemini-extension-service console</span>
      <span id="target"></span>
      <span id="session">no session</span>
      <span id="voiceState" class="vstate"></span>
      <select id="voiceSel" class="vsel" title="Text-to-speech voice"></select>
      <span id="voiceRate" class="vrate" title="Speech rate — Ctrl+. faster, Ctrl+, slower">1.0×</span>
      <button id="voiceBtn" class="vbtn" title="Voice mode — talk with Alt+M, Esc to stop/interrupt">🎙 voice off</button>
    </div>
    <div id="screen" aria-live="polite"></div>
    <div id="inputline">
      <span id="ps1">harness$</span>
      <input
        id="cmd"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="type a prompt for Gemini, or :help"
      />
    </div>
    <script src="config.js"></script>
    <script src="app.js"></script>
    <script src="voice.js"></script>
  </body>
</html>
